<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Face Detector</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/vision_bundle.mjs"
    ></script>
</head>
<!-- comment -->
<body>

    <div class="background">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <div class="container">

        <header>

            <div class="logo">

                <div class="logo-circle">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 3H5a2 2 0 0 0-2 2v4"></path>
                        <path d="M15 3h4a2 2 0 0 1 2 2v4"></path>
                        <path d="M9 21H5a2 2 0 0 1-2-2v-4"></path>
                        <path d="M15 21h4a2 2 0 0 0 2-2v-4"></path>
                        <circle cx="12" cy="11" r="1.4" fill="white" stroke="none"></circle>
                        <path d="M9 15s1.2 1 3 1 3-1 3-1"></path>
                    </svg>
                </div>

                <div class="title">

                    <h1>Face Detector</h1>

                    <p>
                        AI Face Detection System
                    </p>

                </div>

            </div>

            <div class="status-card">

                <div class="status-top">

                    <span>STATUS</span>

                </div>

                <div class="status-row">

                    <div class="pulse"></div>

                    <div
                        id="status"
                        class="status-text"
                    >
                        Downloading AI Model...
                    </div>

                </div>

            </div>

        </header>

        <section class="progress-wrapper">

            <div class="progress-top">

                <span>Progress</span>

                <span id="progressPercent">
                    0%
                </span>

            </div>

            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>

            </div>

        </section>

        <main class="dashboard">

            <section class="camera-card">

                <div class="camera-wrapper">

                    <button
                        id="btn-start"
                        disabled
                    >
                        Loading AI...
                    </button>

                    <video
                        id="webcam"
                        autoplay
                        playsinline
                    ></video>

                    <canvas id="overlay"></canvas>

                    <div class="scanner"></div>

                </div>

            </section>

            <aside class="gallery-card">

                <h2>Captured Profiles</h2>

                <div class="slots">

                    <div
                        id="slot-front"
                        class="slot"
                    >

                        <div class="slot-thumb">
                            <canvas id="canvas-front"></canvas>
                            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
                        </div>

                        <div class="slot-info">

                            <span class="slot-label">Front View</span>

                            <div class="slot-status">
                                <span class="status-dot"></span>
                                <span class="status-label">Not Captured</span>
                            </div>

                        </div>

                    </div>

                    <div
                        id="slot-left"
                        class="slot"
                    >

                        <div class="slot-thumb">
                            <canvas id="canvas-left"></canvas>
                            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
                        </div>

                        <div class="slot-info">

                            <span class="slot-label">Left Profile</span>

                            <div class="slot-status">
                                <span class="status-dot"></span>
                                <span class="status-label">Not Captured</span>
                            </div>

                        </div>

                    </div>

                    <div
                        id="slot-right"
                        class="slot"
                    >

                        <div class="slot-thumb">
                            <canvas id="canvas-right"></canvas>
                            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
                        </div>

                        <div class="slot-info">

                            <span class="slot-label">Right Profile</span>

                            <div class="slot-status">
                                <span class="status-dot"></span>
                                <span class="status-label">Not Captured</span>
                            </div>

                        </div>

                    </div>

                </div>
                
                <section class="buttons">

                    <button id="btn-restart">
                        Restart
                    </button>

                    <button id="btn-download">
                        Download Images
                    </button>

                </section>

            </aside>

        </main>


    </div>

    <div
        id="toast"
        class="toast"
    >
        Completed
    </div>
    <canvas id="confettiCanvas"></canvas>
    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
